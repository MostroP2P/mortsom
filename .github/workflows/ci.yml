name: CI

on:
  push:
    # `release/v*` is here because the Release workflow opens its pull
    # request with GITHUB_TOKEN, which never triggers `pull_request`
    # workflows; the branch push is what puts checks on the release.
    branches: [main, 'release/v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Coverage floor (line %). Ratchets upward only; scenario bodies are the
  # tests, not code under test, so they are excluded from the measurement.
  COVERAGE_FLOOR: "80"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The LND gRPC client (fedimint-tonic-lnd) compiles its protobuf
      # definitions at build time and needs the protoc binary on the host.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The LND gRPC client (fedimint-tonic-lnd) compiles its protobuf
      # definitions at build time and needs the protoc binary on the host.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      # The identifier contract test reads the app's registry from a
      # checkout of its `main`; without one it would skip, never fail.
      - uses: actions/checkout@v4
        with:
          repository: MostroP2P/app
          ref: main
          path: app-v2
          sparse-checkout: lib/core/automation
      - run: test -f app-v2/lib/core/automation/automation_ids.dart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          MORTSOM_APP_CHECKOUT: app-v2

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The LND gRPC client (fedimint-tonic-lnd) compiles its protobuf
      # definitions at build time and needs the protoc binary on the host.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex 'scenarios/' \
            --fail-under-lines "$COVERAGE_FLOOR"
