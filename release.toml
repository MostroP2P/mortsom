# cargo-release configuration for Mortsom.
#
# `cargo release <level> --execute` on a `release/vX.Y.Z` branch bumps the
# shared workspace version, regenerates CHANGELOG.md and pushes the branch.
# Tagging and the GitHub release happen in `.github/workflows/release.yml`
# once the resulting pull request lands on `main`. See `docs/releasing.md`.

# The harness is not published to crates.io.
publish = false

# One version for every crate, one commit for the whole workspace.
shared-version = true
consolidate-commits = true

# Releases are reviewed, so the tag is cut from `main` by CI, not locally.
tag = false

# Refuse to release from `main` or a feature branch.
allow-branch = ["release/v[0-9]*"]

push = true
pre-release-commit-message = "chore(release): v{{version}}"
# The hook runs with the crate directory as its working directory, so the
# script is addressed through the workspace root cargo-release exports.
pre-release-hook = ["bash", "-c", "exec \"$WORKSPACE_ROOT/ci/release/changelog.sh\""]
