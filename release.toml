# cargo-release configuration for Mortsom.
#
# `cargo release <level> --execute` bumps the shared workspace version,
# regenerates CHANGELOG.md and pushes the branch. Run from `main` the push is
# the release: `.github/workflows/release.yml` tags it and publishes the
# GitHub release. Run from a `release/vX.Y.Z` branch the workflow opens a
# pull request first and tags once it lands on `main`. See `docs/releasing.md`.

# The harness is not published to crates.io.
publish = false

# One version for every crate, one commit for the whole workspace.
shared-version = true
consolidate-commits = true

# The tag is cut from `main` by CI, not locally.
tag = false

# Release from `main` directly or through a reviewed `release/vX.Y.Z` branch;
# refuse a feature branch.
allow-branch = ["main", "release/v[0-9]*"]

push = true
pre-release-commit-message = "chore(release): v{{version}}"
# The hook runs with the crate directory as its working directory, so the
# script is addressed through the workspace root cargo-release exports.
pre-release-hook = ["bash", "-c", "exec \"$WORKSPACE_ROOT/ci/release/changelog.sh\""]
