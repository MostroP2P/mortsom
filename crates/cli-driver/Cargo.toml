[package]
name = "mortsom-cli-driver"
description = "Mortsom driver for the mostro-cli command-line client: the process boundary, the JSON envelope, the sanitized transcript and the CLI session."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mortsom-common = { workspace = true }
mortsom-ui-driver = { workspace = true }
mortsom-desktop-driver = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
regex = { workspace = true }
rustix = { workspace = true }
zeroize = { workspace = true }

[features]
# Exposes the scripted CLI process to other crates' tests.
testing = []

[dev-dependencies]
tempfile = { workspace = true }
# Paused time, for deadlines a test must not wait out.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
