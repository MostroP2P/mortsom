[package]
name = "mortsom-coordinator"
description = "Mortsom coordinator: configuration, runner, budgets, timeouts, cleanup, reporting and the `mortsom` command-line interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "mortsom"
path = "src/main.rs"

[dependencies]
tempfile.workspace = true
sha2.workspace = true
mortsom-common = { workspace = true }
mortsom-app-contract = { workspace = true }
mortsom-ui-driver = { workspace = true }
mortsom-desktop-driver.workspace = true
mortsom-environment = { workspace = true }
mortsom-observers = { workspace = true }
mortsom-scenario-kit = { workspace = true }
mortsom-solver = { workspace = true }
mortsom-adapter-mobile-v2 = { workspace = true }
mortsom-adapter-cli = { workspace = true }
mortsom-cli-driver = { workspace = true }
mortsom-scenarios = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
figment = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
rustix.workspace = true
mostro-core = { workspace = true }
nostr-sdk = { workspace = true }
nwc = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
lightning-invoice = { workspace = true, features = ["std"] }
bitcoin = { workspace = true }
mortsom-ui-driver = { workspace = true, features = ["testing"] }
# `start_paused`: a test may assert a deadline without waiting for it.
tokio = { workspace = true, features = ["test-util"] }
assert_cmd = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
