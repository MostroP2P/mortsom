[package]
name = "mortsom-ui-driver"
description = "Mortsom UI driver foundation: the UiSession boundary, the process runner and the W3C WebDriver client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mortsom-common = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process"] }

[features]
# Exposes the scripted process runner to other crates' tests.
testing = []

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
