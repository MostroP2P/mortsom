[package]
name = "mortsom-desktop-driver"
description = "Public accessibility drivers for isolated Linux and Web clients."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mortsom-ui-driver.workspace = true
mortsom-common.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest.workspace = true
atspi = { version = "0.30.0", default-features = false, features = ["proxies", "tokio"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
# Peer-to-peer connections let tests serve a fake AT-SPI tree without a bus.
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "p2p"] }

