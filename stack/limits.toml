# Daemon limits the stack declares to the harness (spec section 5, step 3).
# Recorded in every run's stack fingerprint. The windows must equal the
# values in mostro-settings.tpl.toml; a test fails when they drift apart.

# Untaken order lifetime. The daemon's own default is [mostro].expiration_hours,
# hour-granular; a Mortsom client build asks the daemon for this lifetime on
# every order it creates (MORTSOM_ORDER_EXPIRY_SECS), and the reaper checks
# expiries once a minute.
order_expiration_secs = 600
# [lightning].hold_invoice_expiration_window
hold_invoice_expiry_secs = 120
# [mostro].expiration_seconds
buyer_invoice_deadline_secs = 120
# [lightning].invoice_expiration_window
payout_invoice_min_expiry_secs = 300
# [lightning].max_inflight_payouts_per_destination
max_inflight_payouts_per_destination = 2
# Concurrent payout dispatch capacity built into the daemon release.
payout_dispatch_permits = 8
