[workspace]
resolver = "3"
# Managed checkouts (the app, mostro-cli, mostro) keep their own Rust
# workspace and dependency graph.
exclude = [".mortsom"]
members = [
    "crates/common",
    "crates/coordinator",
    "crates/app-contract",
    "crates/desktop-driver",
    "crates/environment",
    "crates/observers",
    "crates/scenario-kit",
    "crates/solver",
    "crates/app-adapters/mobile-v2",
    "crates/app-adapters/cli",
    "crates/cli-driver",
    "scenarios",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/MostroP2P/mortsom"
rust-version = "1.89"

[workspace.dependencies]
sha2 = "0.11.0"
rand = "0.10.2"
fedimint-tonic-lnd = { version = "0.4.0", features = ["lightningrpc", "invoicesrpc", "routerrpc"] }
# Internal crates
mortsom-common = { path = "crates/common" }
mortsom-app-contract = { path = "crates/app-contract" }
mortsom-ui-driver = { path = "crates/ui-driver" }
mortsom-desktop-driver = { path = "crates/desktop-driver" }
mortsom-environment = { path = "crates/environment" }
mortsom-observers = { path = "crates/observers" }
mortsom-scenario-kit = { path = "crates/scenario-kit" }
mortsom-solver = { path = "crates/solver" }
mortsom-adapter-mobile-v2 = { path = "crates/app-adapters/mobile-v2" }
mortsom-adapter-cli = { path = "crates/app-adapters/cli" }
mortsom-cli-driver = { path = "crates/cli-driver" }
mortsom-scenarios = { path = "scenarios" }

# Protocol types — pinned exactly; fixes the nostr line at 0.45.
mostro-core = "=0.17.3"
nostr-sdk = "0.45.1"
nostr = { version = "0.45.1", default-features = false, features = ["std", "nip06", "nip44", "nip59"] }
nwc = "0.45.0"

# Async runtime and process management
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
futures = "0.3.34"
rustix = { version = "1.1.4", features = ["fs", "process"] }

# CLI, configuration, serialization
clap = { version = "4.6.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
figment = { version = "0.10.19", features = ["toml"] }

# Errors and diagnostics
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# HTTP (WebDriver protocol client)
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# Both `ring` and `aws-lc-rs` reach rustls through the dependency tree, so
# the process must pick one explicitly; see `mortsom_common::tls`.
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
base64 = "0.22.1"

# Misc
uuid = { version = "1.24.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
inventory = "0.3.24"
lightning-invoice = "0.34.1"
bitcoin = "0.32.7"
regex = "1.13.1"
zeroize = { version = "1.9.0", features = ["derive"] }

# Dev-dependencies
mockall = "0.15.0"
wiremock = "0.6.5"
tempfile = "3.27.0"
assert_cmd = "2.2.2"
tokio-test = "0.4.5"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
